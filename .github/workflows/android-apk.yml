name: Android Debug APK CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Validate, Test & Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and ensure API 35 platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2 and validate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          wrapper-validation-enabled: true

      - name: Ensure Gradle wrapper script and JAR are ready
        run: |
          chmod +x ./gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar was omitted during text-only export; generating official Gradle 8.10.2 wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          ./gradlew --version

      - name: Materialize optional Firebase Android config from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            echo "Configured app/google-services.json from repository secret."
          else
            echo "GOOGLE_SERVICES_JSON secret not set; building clean debug APK without embedded Firebase credentials."
          fi

      - name: Validate Android Gradle configuration
        run: ./gradlew help --no-daemon

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android Debug APK
        env:
          SN_BACKEND_BASE_URL: ${{ vars.SN_BACKEND_BASE_URL || secrets.SN_BACKEND_BASE_URL }}
          FIREBASE_WEB_CLIENT_ID: ${{ vars.FIREBASE_WEB_CLIENT_ID || secrets.FIREBASE_WEB_CLIENT_ID }}
          SN_CONTACT_WHATSAPP_NUMBER: ${{ vars.SN_CONTACT_WHATSAPP_NUMBER || secrets.SN_CONTACT_WHATSAPP_NUMBER }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload SN Creator Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SN-Creator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish workflow summary
        if: always()
        run: |
          {
            echo "## SN Creator Android CI Summary"
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
              echo "- **Debug APK:** Built successfully (\`app/build/outputs/apk/debug/app-debug.apk\`, ${APK_SIZE})"
              echo "- **Artifact Name:** \`SN-Creator-debug-apk\`"
            else
              echo "- **Debug APK:** Build did not produce \`app-debug.apk\`. Inspect failed step logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
